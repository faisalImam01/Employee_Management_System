<div class="col-md-6 offset-md-3">
<h1>Create Employee</h1>
<form (ngSubmit)="onSubmit()">
    <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" class="form-control" id="firstName" [(ngModel)]="employee.firstName" name="firstName" placeholder="Enter First Name">
    </div>

     <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" class="form-control" id="lastName" [(ngModel)]="employee.lastName" name="lastName" placeholder="Enter Last Name">
    </div>

     <div class="form-group">
        <label for="emailId">Email Id</label>
        <input type="email" class="form-control" id="emailId" [(ngModel)]="employee.emailId" name="emailId" placeholder="Enter Email Id ">
    </div>
    <button class="btn btn-success" type="submit">Submit</button>
</form>
</div>
